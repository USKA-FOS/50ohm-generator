  <div id="generator_status"></div>
  <script>
    function updateStatus() {
      fetch('generator_status.json')
        .then(res => res.json())
        .then(data => {
          let text;
  
          const el = document.getElementById('generator_status');
          el.textContent = '';
  
          if (data.status === 'completed') {
            const date = new Date(data.timestamp * 1000).toLocaleString(undefined, { hour12: false });
            el.textContent = `{{ ui('generator_status_last_build') }}\n${date}`;
          } else if (data.status === 'running' || data.status === 'finalizing') {
            const elapsed = Math.floor(Date.now() / 1000 - data.timestamp);
            const dot = document.createElement('span');
            if (elapsed > 300) {
              const date = new Date(data.timestamp * 1000).toLocaleString(undefined, { hour12: false });
              dot.className = 'error-dot';
              el.append('{{ ui('generator_status_crashed') }}\n', dot, ` ${date}`);
            } else {
              const mins = Math.floor(elapsed / 60);
              const secs = elapsed % 60;
              dot.className = 'dot';
              const label = data.status === 'finalizing' ? '{{ ui('generator_status_finalizing') }}' : '{{ ui('generator_status_running') }}';
              el.append(`${label}\n`, dot, ` ${mins}m ${secs}s`);
            }
          }
        });
    }
  
    const n = 1; // poll interval in seconds
    updateStatus();
    setInterval(updateStatus, n * 1000);
  </script>
